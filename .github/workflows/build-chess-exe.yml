name: Build ChessAnalysis.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "screen-agent/analysis-app/**"
      - ".github/workflows/build-chess-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: screen-agent/analysis-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pywebview pyinstaller pillow

      - name: Make icon
        run: python make_icon.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name ChessAnalysis
          --icon icon.ico
          --add-data "index.html;." --add-data "chess.js;." --add-data "stockfish.asm.js;."
          --add-data "LICENSE-stockfish.txt;." --add-data "LICENSE-chess.js.txt;."
          main.py

      - name: Check the exe exists
        run: dir dist\ChessAnalysis.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ChessAnalysis-windows
          path: screen-agent/analysis-app/dist/ChessAnalysis.exe
          retention-days: 30
